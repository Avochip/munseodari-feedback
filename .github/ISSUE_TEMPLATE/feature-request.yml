name: "기능 제안"
description: "문서다리에 추가되거나 개선되면 좋을 기능을 알려주세요."
title: "[제안] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        의견을 보내주셔서 감사합니다.

        **이곳은 누구나 볼 수 있는 공개 게시판입니다.**
        실제 문서, 개인정보, 회사·기관명, 고객정보나 기밀정보를 사례로 올리지 마세요. 설명이 필요하면 허위 이름과 허위 내용으로 만든 예시만 사용해 주세요.

  - type: checkboxes
    id: safe-to-publish
    attributes:
      label: "공개 게시 확인"
      options:
        - label: "작성 내용이 공개되는 것을 확인했으며 실제 문서·개인정보·기밀정보를 올리지 않았습니다."
          required: true

  - type: textarea
    id: requested-improvement
    attributes:
      label: "어떤 아이디어든 편하게 적어 주세요."
      description: "짧아도 괜찮습니다. 떠오른 기능이나 불편했던 점을 자유롭게 알려주세요."
      placeholder: "예: 여러 파일을 한 번에 변환할 수 있으면 좋겠어요."
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "관련된 부분 (선택)"
      description: "분류하고 싶다면 골라주세요. 선택하지 않아도 됩니다."
      options:
        - "지원 파일 형식"
        - "변환 결과의 글자·표·그림·쪽 배치"
        - "PDF·사진 글자 인식(OCR)"
        - "속도와 안정성"
        - "사용 방법과 화면"
        - "다운로드와 파일 관리"
        - "설치와 업데이트"
        - "접근성"
        - "개인정보와 보안"
        - "그 밖의 개선"

  - type: dropdown
    id: related-format
    attributes:
      label: "관련된 파일 형식이 있나요?"
      description: "여러 개를 고를 수 있습니다. 특정 형식과 관계없다면 선택하지 않아도 됩니다."
      multiple: true
      options:
        - "HWP"
        - "HWPX"
        - "DOCX"
        - "PDF"
        - "JPG·PNG 문서 사진"
